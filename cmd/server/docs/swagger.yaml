          schema:
            $ref: '#/definitions/dto.Response'
      security:
      - AdminKey: []
      summary: List a project's templates
      tags:
      - Templates
    post:
      consumes:
      - application/json
      parameters:
      - description: Project UUID
        in: path
        name: projectId
        required: true
        type: string
      - description: Template subject, content, and example data
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.CreateTemplateRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/dto.SwaggerTemplateResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dto.Response'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/dto.Response'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/dto.Response'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/dto.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/dto.Response'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/dto.Response'
      security:
      - AdminKey: []
      summary: Create a project template
      tags:
      - Templates
  /api/projects/{projectId}/templates/{id}:
    delete:
      parameters:
      - description: Project UUID
        in: path
        name: projectId
        required: true
        type: string
      - description: Template UUID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.Response'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/dto.Response'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/dto.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/dto.Response'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/dto.Response'
      security:
      - AdminKey: []
      summary: Soft-delete a template
      tags:
      - Templates
    get:
      parameters:
      - description: Project UUID
        in: path
        name: projectId
        required: true
        type: string
      - description: Template UUID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.SwaggerTemplateResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/dto.Response'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/dto.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/dto.Response'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/dto.Response'
      security:
      - AdminKey: []
      summary: Get a template
      tags:
      - Templates
    put:
      consumes:
      - application/json
      description: Replaces the template's name, subject, content, and example data.
      parameters:
      - description: Project UUID
        in: path
        name: projectId
        required: true
        type: string
      - description: Template UUID
        in: path
        name: id
        required: true
        type: string
      - description: Updated template
        in: body
        name: request
